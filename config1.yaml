seed: 42
workers: 0
dataset: "Augsburg"
dataset_root: "/mnt/user/data/HS-SAR-Augsburg/"
modality_files:
  - "data_HS_LR.mat"
  - "data_SAR_HR.mat"
ground_truth_file: "Augsburg_gt.mat"
model_path: "save/Augsburg"
image_size: 7
dim_emebeding: 512
projection_dim: 128
is_labeled_pixel: false
deterministic_stage_seeding: true
kmeans_seed: -1
joint_seed: -1
kmeans_init_sample_size: 8192

# Training, augmentation, and sampling
batch_size: 128
joint_train_epoch: 20
lr_scale: 1
is_pretrain: true
pretrain_epoch: 10
pretrain_checkpoint_path: ""
reuse_pretrain_checkpoint: true
save_pretrain_checkpoint: true
require_pretrain_checkpoint_when_skipped: true
crop_scale_min: 0.7
mask_pixel_prob: 0.1
mask_band_prob: 0.1
train_sampling_strategy: "all"
train_max_samples: 0

# Optimisation and joint objective
weight_decay: 0.0005
pretrain_learning_rate: 0.0001
joint_learning_rate: 0.00001
contrastive_param: 0.3
joint_contrastive_weight: 0.005
lambda_clu: 0.03
cluster_lambda_ramp_epochs: 1
lambda_rel_max: 0.3
dec_frequency_power: 1.0
init_anchor_weight: 0.3
ema_anchor_momentum: 0.995

# Reliability fusion and reliability-aware contrastive learning (RAC)
use_reliability_fusion: true
use_reliability_contrastive: true
rac_connection_mode: "hybrid"
rac_encoder_mix: 0.1
reliability_graph_sigma: 0.2
reliability_graph_alpha: 0.5
reliability_graph_steps: 1
reliability_graph_topk: 16
relation_warmup_epochs: 3
relation_ramp_epochs: 5

# DEC clustering and high-confidence CLU
use_high_confidence_clu: true
clu_reliable_ratio: 0.6
clu_warmup_epochs: 2
clu_ramp_epochs: 4

# Cluster coverage and donor-repair policy
cluster_freeze_epochs: 0
cluster_coverage_min_samples: 500
reseed_empty_clusters: true
reseed_undercovered_clusters: true
cluster_reseed_max_attempts: 5
cluster_reseed_candidate_pool: 256
cluster_repair_cooldown_epochs: 2
cluster_repair_strategy: "split_largest"
post_epoch_cluster_guard: true
preserve_high_confidence_on_incomplete_coverage: true
preserve_cooling_centers: false

# Soft cluster protection is active; hard-occupancy protection remains disabled
# through the implementation default (weight 0.0).
small_cluster_protection_weight: 0.02
small_cluster_floor_factor: 0.5
small_cluster_min_ratio: 0.003

# The current code implements best-OA checkpoint selection.
save_best_oa_checkpoint: true
